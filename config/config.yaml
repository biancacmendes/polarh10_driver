bluetooth:
  device_address: "A0:9E:1A:EB:ED:38"
  scan_timeout: 10
  connect_timeout: 75
  pair: true
  direct_address_fallback: true
  device_name: "Polar H10"
  prefer_direct_heart_rate: true
  reset_pairing_on_start: true
  unpair_on_close: true

# Operating mode of the driver
# modes:
#   "stream"   -> continuously sends data through the gateway
#   "record"   -> records locally to file
#   "hybrid"   -> streams and allows recording to be triggered remotely
mode: "stream"

ecg:
  sample_rate_hz: 130
  resolution_bits: 14

recording:
  enabled: false
  output_file: "ecg_raw.csv"

  # Optional automatic recording duration
  duration_seconds: 60

  # Allows the WebSocket server or HTTP endpoint to trigger recording
  trigger:
    enabled: true
    start_endpoint: "/record/start"
    stop_endpoint: "/record/stop"

gateway:
  enabled: true
  host: "0.0.0.0"
  port: 8765
  websocket_path: "/stream"

stream:
  packet_size: 20
  prefer_heart_rate: true
  send_ecg: true
  send_rr: true
  send_hr: true

# Enable an HTML page for data visualization (prototype!)
visualization:
  enabled: true
  route: "/"
